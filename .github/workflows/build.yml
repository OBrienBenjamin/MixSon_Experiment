name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: macos-15-intel, name: mac-intel }
          - { os: macos-latest, name: mac-apple-silicon }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pygame==2.6.1 imageio-ffmpeg pyinstaller

      - name: Build app
        run: pyinstaller --noconfirm --clean --name MixSon --windowed --collect-all imageio_ffmpeg launcher.py

      - name: Version (tag v1.2.3 -> 1.2.3; manual runs -> 0.0.0-dev)
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # ---------- Windows: installer (Inno Setup) ----------
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path "installer" | Out-Null
          Invoke-WebRequest "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "installer\vc_redist.x64.exe"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "installer\mixson.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem installer_output

      - name: Collect Windows asset
        if: runner.os == 'Windows'
        shell: bash
        run: echo "ASSET=installer_output/MixSon-Setup-${{ steps.ver.outputs.version }}.exe" >> "$GITHUB_ENV"

      # ---------- macOS: zip of the .app ----------
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/MixSon.app MixSon-${{ matrix.name }}.zip
          echo "ASSET=MixSon-${{ matrix.name }}.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: MixSon-${{ matrix.name }}
          path: ${{ env.ASSET }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
